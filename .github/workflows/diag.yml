# Temporary: prints aggregate contribution totals as the cards' token sees them.
name: Contributions diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: |
          q='{"query":"query{viewer{login createdAt organizations(first:20){totalCount} contributionsCollection{restrictedContributionsCount contributionCalendar{totalContributions} totalCommitContributions totalPullRequestContributions totalPullRequestReviewContributions totalIssueContributions commitContributionsByRepository(maxRepositories:100){contributions{totalCount}}}}}"}'
          curl -sS -X POST https://api.github.com/graphql -H "Authorization: bearer $TOKEN" -H 'Content-Type: application/json' --data "$q" > out.json
          jq -r '.errors' out.json
          jq -r '.data.viewer | {login, createdAt, orgs: .organizations.totalCount}' out.json
          jq -r '.data.viewer.contributionsCollection | {restricted: .restrictedContributionsCount, calendarTotal: .contributionCalendar.totalContributions, commits: .totalCommitContributions, prs: .totalPullRequestContributions, reviews: .totalPullRequestReviewContributions, issues: .totalIssueContributions}' out.json
          jq -r '[.data.viewer.contributionsCollection.commitContributionsByRepository[]?.contributions.totalCount] | {repos: length, commitsSumByRepo: add}' out.json
