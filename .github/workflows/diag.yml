name: Contributions diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: |
          for range in 2023-02-22/2023-12-31 2024-01-01/2024-12-31 2025-01-01/2025-12-31 2026-01-01/2026-11-18; do
            from="${range%%/*}T00:00:00Z"; to="${range##*/}T23:59:59Z"
            q="{\"query\":\"query{viewer{contributionsCollection(from:\\\"$from\\\",to:\\\"$to\\\"){restrictedContributionsCount totalCommitContributions totalPullRequestContributions totalPullRequestReviewContributions totalIssueContributions contributionCalendar{totalContributions}}}}\"}"
            curl -sS -X POST https://api.github.com/graphql -H "Authorization: bearer $TOKEN" -H 'Content-Type: application/json' --data "$q" > out.json
            jq -r --arg r "$range" '.data.viewer.contributionsCollection | "\($r)  calendar=\(.contributionCalendar.totalContributions) commits=\(.totalCommitContributions) prs=\(.totalPullRequestContributions) reviews=\(.totalPullRequestReviewContributions) issues=\(.totalIssueContributions) restricted=\(.restrictedContributionsCount)"' out.json
            jq -r '.errors // empty' out.json
          done
